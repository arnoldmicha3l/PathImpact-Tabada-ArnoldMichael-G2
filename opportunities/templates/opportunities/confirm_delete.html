{% extends "accounts/base.html" %}
{% block title %}Confirm{% endblock %}
{% block content %}
<section class="card narrow center">
    <div class="big">⚠️</div>
    <h1>{{ title }}</h1>
    <p class="muted">{{ detail }}</p>
    <form method="post">{% csrf_token %}
        <div class="actions center"><button class="btn btn-danger" type="submit">Yes, continue</button>
        {% if cancel_pk %}<a class="btn btn-light" href="{% url cancel_url cancel_pk %}">Cancel</a>{% else %}<a class="btn btn-light" href="{% url cancel_url %}">Cancel</a>{% endif %}</div>
    </form>
</section>
{% endblock %}
