{% extends "accounts/base.html" %}
{% load static %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<link rel="stylesheet" href="{% static 'accounts/contour-fold.css' %}">
<div class="cf">
<section class="cf-panel" aria-labelledby="edit-heading">
  <p class="cf-label">Account settings</p>
  <h1 id="edit-heading">Edit profile</h1>
  <p>Keep your account details up to date.</p>
  <form method="post">
    {% csrf_token %}
    {% include "accounts/contour-fields.html" %}
    <div class="actions">
      <button class="btn" type="submit">Save changes</button>
      <a class="btn btn-light" href="{% url 'accounts:profile' %}">Cancel</a>
    </div>
  </form>
</section>
</div>
{% endblock %}
