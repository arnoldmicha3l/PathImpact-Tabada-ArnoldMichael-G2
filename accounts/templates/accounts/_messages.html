{% if messages %}
    <div class="phase1-notices" aria-label="Account notifications">
        {% for message in messages %}
            {% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}
                <div class="phase1-notice phase1-notice--error" role="alert">
                    <strong>Error:</strong> <span>{{ message }}</span>
                </div>
            {% elif message.level == DEFAULT_MESSAGE_LEVELS.WARNING %}
                <div class="phase1-notice phase1-notice--warning" role="status">
                    <strong>Notice:</strong> <span>{{ message }}</span>
                </div>
            {% else %}
                <div class="phase1-notice" role="status">
                    <span>{{ message }}</span>
                </div>
            {% endif %}
        {% endfor %}
    </div>
{% endif %}
