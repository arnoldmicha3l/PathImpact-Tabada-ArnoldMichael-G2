                <svg class="mm-icon"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.7"
                     aria-hidden="true">

                    <path d="M10 17l5-5-5-5M15 12H3"/>
                    <path d="M13 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/>
