
<aside class="mm-sidebar" id="workspace-sidebar">

    <nav class="mm-sidebar-nav"
         aria-label="Administrator navigation"
         style="flex: 1 0 auto;">

        {% with current=request.resolver_match.url_name %}

        <div class="mm-nav-group">

            <span style="padding: 8px 12px; font-size: 10px; font-weight: 650; color: #71717a; letter-spacing: .6px;">
                WORKSPACE
            </span>

            <a href="{% url 'accounts:administrator_dashboard' %}"
               {% if current == "administrator_dashboard" %}
                   class="mm-active"
                   aria-current="page"
               {% endif %}>

                <svg class="mm-icon" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="1.7" aria-hidden="true">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>

                <span>Dashboard</span>

            </a>

        </div>

        <div class="mm-nav-divider"></div>

        <div class="mm-nav-group">

            <span style="padding: 8px 12px; font-size: 10px; font-weight: 650; color: #71717a; letter-spacing: .6px;">
                ACADEMIC MANAGEMENT
            </span>

            <a href="{% url 'accounts:programs' %}"
               {% if current == "programs" or current == "program_create" or current == "program_edit" or current == "program_delete" %}
                   class="mm-active"
               {% endif %}
               {% if current == "programs" %}
                   aria-current="page"
               {% endif %}>

                <svg class="mm-icon" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="1.7" aria-hidden="true">
                    <path d="m2 10 10-6 10 6-10 6z"/>
                    <path d="M6 13v5c4 3 8 3 12 0v-5M22 10v7"/>
                </svg>

                <span>Programs</span>

            </a>

            <a href="{% url 'accounts:subjects' %}"
               {% if current == "subjects" or current == "subject_create" or current == "subject_edit" or current == "subject_delete" %}
                   class="mm-active"
               {% endif %}
               {% if current == "subjects" %}
                   aria-current="page"
               {% endif %}>

                <svg class="mm-icon" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="1.7" aria-hidden="true">
                    <path d="M12 5v16M12 5C9 2 5 2 2 4v15c4-2 7-1 10 2 3-3 6-4 10-2V4c-3-2-7-2-10 1z"/>
                </svg>

                <span>Subjects</span>

            </a>

        </div>

        <div class="mm-nav-divider"></div>

        <div class="mm-nav-group">

            <span style="padding: 8px 12px; font-size: 10px; font-weight: 650; color: #71717a; letter-spacing: .6px;">
                ACCOUNT
            </span>

            <a href="{% url 'accounts:profile' %}"
               {% if current == "profile" %}
                   class="mm-active"
                   aria-current="page"
               {% endif %}>

                <svg class="mm-icon" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="1.7" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
                </svg>

                <span>My profile</span>

            </a>

            <a href="{% url 'accounts:edit_profile' %}"
               {% if current == "edit_profile" %}
                   class="mm-active"
                   aria-current="page"
               {% endif %}>

                <svg class="mm-icon" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="1.7" aria-hidden="true">
                    <path d="M12 20h9"/>
                    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4z"/>
                </svg>

                <span>Edit profile</span>

            </a>

        </div>

        {% endwith %}

    </nav>

    <div class="mm-sidebar-bottom">

        <form method="post"
              action="{% url 'accounts:logout' %}">

            {% csrf_token %}

            <button type="submit" class="mm-logout">

                <svg class="mm-icon" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="1.7" aria-hidden="true">
                    <path d="M10 17l5-5-5-5M15 12H3"/>
                    <path d="M13 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/>
                </svg>

                <span>Log out</span>

            </button>

        </form>

    </div>

</aside>
