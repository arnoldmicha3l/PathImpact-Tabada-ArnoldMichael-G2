
<aside class="mm-sidebar" id="workspace-sidebar">

    <nav class="mm-sidebar-nav" aria-label="Workspace navigation">

        {% with current=request.resolver_match.url_name %}

        <div class="mm-nav-group">

            <a href="{% url 'accounts:dashboard' %}"
               {% if current == "dashboard" or current == "student_dashboard" or current == "administrator_dashboard" %}
                   class="mm-active"
                   aria-current="page"
               {% endif %}>

                <svg class="mm-icon"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.7"
                     stroke-linejoin="round"
                     aria-hidden="true">

                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>

                </svg>

                <span>Dashboard</span>

            </a>

            {% if user.role == "student" %}

                <a href="{% url 'assessment_index' %}"
                   {% if current == "assessment_index" or current == "assessment_create" or current == "assessment_detail" or current == "assessment_edit" or current == "assessment_delete" %}
                       class="mm-active"
                       {% if current == "assessment_index" %}
                           aria-current="page"
                       {% endif %}
                   {% endif %}>

                    <svg class="mm-icon"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.7"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         aria-hidden="true">

                        <rect x="5" y="4" width="14" height="18" rx="2"/>
                        <path d="M9 2h6v4H9z"/>
                        <path d="M9 11h6M9 15h6M9 19h4"/>

                    </svg>

                    <span>Self-assessments</span>

                </a>

            {% endif %}

        </div>

        <div class="mm-nav-divider"></div>

        <div class="mm-nav-group">

            <a href="{% url 'accounts:profile' %}"
               {% if current == "profile" %}
                   class="mm-active"
                   aria-current="page"
               {% endif %}>

                <svg class="mm-icon"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.7"
                     stroke-linecap="round"
                     aria-hidden="true">

                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>

                </svg>

                <span>My profile</span>

            </a>

            <a href="{% url 'accounts:edit_profile' %}"
               {% if current == "edit_profile" %}
                   class="mm-active"
                   aria-current="page"
               {% endif %}>

                <svg class="mm-icon"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.7"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     aria-hidden="true">

                    <path d="M12 20h9"/>
                    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4z"/>

                </svg>

                <span>Edit profile</span>

            </a>

        </div>

        {% endwith %}

    </nav>

    <div class="mm-sidebar-bottom">

        <form method="post"
              action="{% url 'accounts:logout' %}">

            {% csrf_token %}

            <button type="submit" class="mm-logout">

                <svg class="mm-icon"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.7"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     aria-hidden="true">

                    <path d="M10 17l5-5-5-5"/>
                    <path d="M15 12H3"/>
                    <path d="M13 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/>

                </svg>

                <span>Log out</span>

            </button>

        </form>

    </div>

</aside>
