<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in | PathImpact</title></head>
<body>
  <main>
    <h1>Sign in to PathImpact</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
      {% endif %}
      <button type="submit">Sign in</button>
    </form>
    <p><a href="{% url 'accounts:register' %}">Create an account</a></p>
  </main>
</body>
</html>
